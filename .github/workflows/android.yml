name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug lint

      # Release assets do NOT count against artifact storage quota
      # (same pattern as WiFi Transfer / POS / Studio repos).
      - name: Read version
        run: echo "VERSION=$(grep -oP 'versionName\s*=\s*\"\K[^\"]+' app/build.gradle.kts)" >> $GITHUB_ENV

      - name: Rename APK for release
        run: |
          mkdir rel
          cp app/build/outputs/apk/debug/FB_Live_Group_Poster-debug.apk \
             "rel/FB_Live_Group_Poster-v${VERSION}.apk"
          ls -la rel/

      - name: Attach APK to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }} — FB Live Group Poster
          body: |
            FB Live Group Poster Android app (side-load).

            Install: uninstall the previous version once if Android complains
            about the signature, then install this APK.
          files: rel/FB_Live_Group_Poster-v${{ env.VERSION }}.apk
