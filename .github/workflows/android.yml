name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed release APKs (stable keystore)
        run: gradle assembleRelease assembleFresh lint
        env:
          FB_KEYSTORE_B64: ${{ secrets.FB_KEYSTORE_B64 }}
          FB_STORE_PASS: ${{ secrets.FB_STORE_PASS }}
          FB_KEY_PASS: ${{ secrets.FB_KEY_PASS }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS }}

      # Release assets do NOT count against artifact storage quota
      # (same pattern as WiFi Transfer / POS / Studio repos).
      - name: Read version
        run: echo "VERSION=$(grep -oP 'versionName\s*=\s*\"\K[^\"]+' app/build.gradle.kts)" >> $GITHUB_ENV

      - name: Rename APK for release
        run: |
          mkdir rel
          cp app/build/outputs/apk/release/FB_Live_Group_Poster-release.apk \
             "rel/FB_Live_Group_Poster-v${VERSION}.apk"
          cp app/build/outputs/apk/fresh/FB_Live_Group_Poster-fresh.apk \
             "rel/FB_Live_Group_Poster-FreshInstall-v${VERSION}.apk"
          ls -la rel/

      - name: Attach APK to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }} — FB Live Group Poster
          body: |
            FB Live Group Poster Android app (side-load).

            - Normal APK: upgrades compatible release-signed installations.
            - FreshInstall APK: separate package identity for phones showing
              "App not installed" because an older/debug signature conflicts.
              Enable the accessibility service again after a fresh install.

            v0.4.7 is release-signed — older DEBUG builds (up to v0.4.6) must be
            uninstalled once before installing; every later version then
            installs right over (same signature).

            If Google Play Protect blocks the install: Play Store > profile icon
            > Play Protect > gear icon > turn OFF "Scan apps with Play
            Protect", install, then turn it back ON.
          files: |
            rel/FB_Live_Group_Poster-v${{ env.VERSION }}.apk
            rel/FB_Live_Group_Poster-FreshInstall-v${{ env.VERSION }}.apk
